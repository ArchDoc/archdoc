# An example for the playground: a plausible bug, followed through the example
# model. There's no code in the demo repos, so no step says it was reproduced.
triage: small-refund-waits-for-finance
title: A $4 refund on a $12 ride waits for finance instead of going through
status: root-caused
severity: high
reported: { by: rider, at: 2026-10-02, link: https://example.com/support/tickets/4812 }
symptom: |
  refund ref-ch-81 for trip-81: status pending_approval (expected approved)
  amount_cents=40000 charge.amount_cents=1200 reason=overcharge
reproduce: 'POST /refunds { "charge_id": "ch-81", "amount": 4.00 }' # a $4 refund on a $12 charge
expands: request-refund#4 # api-gateway → payments.charges: asks for a refund
hypotheses:
  - claim: refund-approval sends small refunds to finance
    element: payments.charges.refunds
    verdict: ruled-out
    evidence: read
    note: It auto-approves a refund up to half the charge, so 400 cents on a 1200-cent charge goes through. It only sends this one to finance because it sees 40000.
  - claim: The amount is converted to cents twice on the way to payments
    element: api-gateway
    verdict: confirmed
    evidence: inferred
    note: The app sends amount_cents=400, and payments sees 40000, a factor of 100.
root-cause:
  step: 3
  summary: The gateway converts the amount to cents a second time. The app already sends amount_cents, so a 400-cent refund reaches payments as 40000 and refund-approval sends it to finance.
steps:
  - { from: rider, to: app, action: Reports a $4 overcharge on trip-81, evidence: inferred }
  - from: app
    to: api-gateway
    action: Sends the refund request
    sends: payments.RefundRequest
    evidence: read
    observed: { RefundRequest.amount_cents: 400 }
  - from: api-gateway
    to: payments.charges
    action: Forwards the refund request, multiplying the amount by 100
    sends: payments.RefundRequest
    role: cause
    evidence: inferred
    observed: { RefundRequest.amount_cents: 40000 }
    expected: { RefundRequest.amount_cents: 400 }
  - from: payments.charges
    to: payments.charges.refunds
    action: Decides with refund-approval
    decides: payments.refund-approval
    role: spreads
    evidence: read
    observed: { outcome: needs-finance-approval }
    expected: { outcome: auto-approve }
  - from: payments.charges
    to: payments.ledger
    action: Saves the refund for finance to approve
    creates: { payments.Refund: { status: pending_approval } }
    role: symptom
    evidence: inferred
fix:
  summary: Pass amount_cents through unchanged in the gateway; only the app converts dollars to cents.
