archdoc: "2.0"
namespace: invoicing
elements:
  invoicing:
    kind: container
    technology: Python, FastAPI
    description: Issues invoices and looks up customers.
    code: "**"
    uses: { db: Reads and writes invoices and customers }
    elements:
      api:
        kind: component
        description: The FastAPI app and its routers.
        code: [invoicing/main.py, invoicing/api/**]
        uses: { services: Issues invoices and finds customers }
      services:
        kind: component
        description: Billing and customer lookups.
        code: invoicing/services/**
        uses: { models: Builds invoices, persistence: Opens sessions }
      models:
        kind: component
        description: SQLAlchemy models for invoices and customers.
        code: invoicing/models/**
      persistence:
        kind: component
        description: The SQLAlchemy engine and sessions.
        code: invoicing/db.py
        uses: { db: Connects }
  db:
    kind: datastore
    technology: PostgreSQL
    description: Invoices and customers.
actors:
  client:
    kind: agent
    description: An app that issues invoices and looks up customers over HTTP.
    uses: { invoicing: Issues invoices and finds customers }
journeys:
  issue-invoice:
    actor: client
    goal: Bill a customer
    importance: critical
    steps:
      - { from: client, to: invoicing, action: POSTs an invoice, code: invoicing/api/invoices.py }
      - { from: invoicing.api, to: invoicing.services, action: Issues the invoice, code: invoicing/api/invoices.py }
      - { from: invoicing.services, to: invoicing.models, action: Builds the invoice, code: invoicing/services/billing.py }
      - { from: invoicing.services, to: invoicing.persistence, action: Saves it, code: invoicing/services/billing.py }
      - { from: invoicing.persistence, to: db, action: Commits the row, code: invoicing/db.py }
  find-customer:
    actor: client
    goal: Look up a customer
    steps:
      - { from: client, to: invoicing, action: GETs a customer, code: invoicing/api/customers.py }
      - { from: invoicing.api, to: invoicing.services, action: Finds the customer, code: invoicing/api/customers.py }
      - { from: invoicing.services, to: invoicing.persistence, action: Queries customers, code: invoicing/services/customers.py }
      - { from: invoicing.persistence, to: db, action: Reads the row, code: invoicing/db.py }
