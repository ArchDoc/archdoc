# A person's model of the fixture: what the evals score against.
archdoc: "2.0"
namespace: shop
elements:
  shop:
    kind: system
    description: An online shop.
    elements:
      web:
        kind: container
        technology: TypeScript, React
        description: The storefront customers browse and check out in.
        code: apps/web/**
        uses:
          api: Calls the HTTP API for products and orders
          shared: Formats prices and types API responses
      api:
        kind: container
        technology: TypeScript, Express
        description: HTTP API for products and orders.
        code: apps/api/**
        uses:
          shared: Types orders and products
        elements:
          routes:
            kind: component
            description: Express routes for orders and products.
            code: [apps/api/src/server.ts, apps/api/src/routes/**]
            uses: { orders: Creates orders, catalog: Looks up products }
          orders:
            kind: component
            description: Creates orders and charges for them.
            code: apps/api/src/orders/**
            uses: { payments: Charges for the order, storage: Saves the order }
          payments:
            kind: component
            description: Records charges.
            code: apps/api/src/payments/**
            uses: { storage: Records the charge }
          catalog:
            kind: component
            description: Product lookups, cached.
            code: apps/api/src/catalog/**
            uses: { storage: Reads products through the cache }
          storage:
            kind: component
            description: The Postgres pool and the Redis client.
            code: apps/api/src/storage/**
            uses: { db: Reads and writes orders and products, cache: Caches products }
      shared:
        kind: container
        technology: TypeScript
        description: Types and helpers the storefront and the API share.
        code: packages/shared/**
      db:
        kind: datastore
        technology: PostgreSQL
        description: Orders, charges, and products.
      cache:
        kind: datastore
        technology: Redis
        description: Cached products.
actors:
  shopper:
    kind: person
    description: Browses products and checks out.
    uses: { web: Shops }
journeys:
  checkout:
    actor: shopper
    goal: Buy what's in the cart
    importance: critical
    steps:
      - { from: shopper, to: web, action: Checks out the cart, code: apps/web/src/pages/cart.tsx }
      - { from: web, to: api, action: POSTs the order, code: apps/web/src/api-client.ts }
      - { from: api.routes, to: api.orders, action: Creates the order, code: apps/api/src/routes/orders.ts }
      - { from: api.orders, to: api.payments, action: Charges for it, code: apps/api/src/orders/service.ts }
      - { from: api.payments, to: api.storage, action: Records the charge, code: apps/api/src/payments/charge.ts }
      - { from: api.orders, to: api.storage, action: Saves the order, code: apps/api/src/orders/service.ts }
      - { from: api.storage, to: db, action: Inserts the order and the charge, code: apps/api/src/storage/db.ts }
  browse-product:
    actor: shopper
    goal: See a product and its price
    steps:
      - { from: shopper, to: web, action: Opens a product page, code: apps/web/src/pages/product.tsx }
      - { from: web, to: api, action: GETs the product, code: apps/web/src/api-client.ts }
      - { from: api.routes, to: api.catalog, action: Looks up the product, code: apps/api/src/routes/products.ts }
      - { from: api.catalog, to: api.storage, action: Reads it through the cache, code: apps/api/src/catalog/products.ts }
      - { from: api.storage, to: cache, action: Reads the cached product, code: apps/api/src/storage/cache.ts }
      - { from: api.storage, to: db, action: Reads the product on a miss, code: apps/api/src/storage/db.ts }
