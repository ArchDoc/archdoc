archdoc: "2.0"
namespace: ledger
elements:
  ledger-api:
    kind: container
    technology: Go
    description: HTTP API for accounts and postings.
    code: cmd/ledger-api/**
    uses: { accounts: Serves accounts, postings: Takes postings, events: Publishes posting.created }
  ledger-worker:
    kind: container
    technology: Go
    description: Settles postings as they're created.
    code: cmd/ledger-worker/**
    uses: { postings: Settles postings, events: Subscribes to posting.created }
  ledger:
    kind: container
    technology: Go
    description: The ledger's domain and storage, shared by the API and the worker.
    code: [go.mod, internal/**]
    elements:
      accounts:
        kind: component
        description: Accounts and their balances.
        code: internal/accounts/**
        uses: { store: Reads accounts }
      postings:
        kind: component
        description: Takes and settles postings.
        code: internal/postings/**
        uses: { store: Writes postings, events: Publishes posting.created }
      store:
        kind: component
        description: The Postgres pool and queries.
        code: internal/store/**
        uses: { postgres: Reads and writes accounts and postings }
      events:
        kind: component
        description: Publishes and subscribes on NATS.
        code: internal/events/**
        uses: { nats: Publishes and subscribes }
  postgres:
    kind: datastore
    technology: PostgreSQL
    description: Accounts and postings.
    code: migrations/**
  nats:
    kind: queue
    technology: NATS
    description: posting.created events.
actors:
  client:
    kind: agent
    description: A service that posts to the ledger and reads balances over HTTP.
    uses: { ledger-api: Posts and reads balances }
journeys:
  post-a-posting:
    actor: client
    goal: Record a posting
    importance: critical
    steps:
      - { from: client, to: ledger-api, action: POSTs a posting, code: cmd/ledger-api/main.go }
      - { from: ledger-api, to: ledger.postings, action: Takes the posting, code: cmd/ledger-api/main.go }
      - { from: ledger.postings, to: ledger.store, action: Writes the posting, code: internal/postings/postings.go }
      - { from: ledger.store, to: postgres, action: Inserts it, code: internal/store/store.go }
      - { from: ledger.postings, to: ledger.events, action: Announces it, code: internal/postings/postings.go }
      - { from: ledger.events, to: nats, action: Publishes posting.created, code: internal/events/bus.go }
  settle-postings:
    actor: client
    goal: Have postings settled
    steps:
      - { from: ledger-worker, to: ledger.events, action: Subscribes to posting.created, code: cmd/ledger-worker/main.go }
      - { from: ledger-worker, to: ledger.postings, action: Settles the posting, code: internal/postings/settle.go }
      - { from: ledger.postings, to: ledger.store, action: Marks it settled, code: internal/postings/settle.go }
      - { from: ledger.store, to: postgres, action: Updates the posting, code: internal/store/store.go }
