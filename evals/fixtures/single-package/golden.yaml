archdoc: "2.0"
namespace: mdlint
elements:
  mdlint:
    kind: container
    technology: TypeScript, CLI
    description: Lints Markdown files.
    code: "**"
    elements:
      cli:
        kind: component
        description: The mdlint command and its subcommands.
        code: src/cli.ts
        uses: { commands: Runs check and fix }
      commands:
        kind: component
        description: check reports problems; fix applies the fixes rules offer.
        code: src/commands/**
        uses:
          config: Reads which rules are off
          parser: Parses each file
          rules: Runs the rules
          render: Prints problems
      parser:
        kind: component
        description: Turns Markdown into headings and links.
        code: src/parser/**
      rules:
        kind: component
        description: The lint rules.
        code: src/rules/**
        uses: { parser: Reads the parsed document, config: Skips rules turned off }
      render:
        kind: component
        description: Prints problems.
        code: src/render/**
        uses: { rules: Prints the problems rules found }
      config:
        kind: component
        description: Reads .mdlintrc.json.
        code: src/config.ts
actors:
  developer:
    kind: person
    description: Runs mdlint on their Markdown.
    uses: { mdlint: Lints and fixes Markdown }
journeys:
  check-files:
    actor: developer
    goal: Find problems in Markdown files
    importance: critical
    steps:
      - { from: developer, to: mdlint, action: Runs mdlint check, code: src/cli.ts }
      - { from: mdlint.cli, to: mdlint.commands, action: Runs check, code: src/cli.ts }
      - { from: mdlint.commands, to: mdlint.config, action: Reads which rules are off, code: src/commands/check.ts }
      - { from: mdlint.commands, to: mdlint.parser, action: Parses each file, code: src/commands/check.ts }
      - { from: mdlint.commands, to: mdlint.rules, action: Runs the rules, code: src/commands/check.ts }
      - { from: mdlint.commands, to: mdlint.render, action: Prints the problems, code: src/commands/check.ts }
  fix-files:
    actor: developer
    goal: Fix what the rules can fix
    steps:
      - { from: developer, to: mdlint, action: Runs mdlint fix, code: src/cli.ts }
      - { from: mdlint.cli, to: mdlint.commands, action: Runs fix, code: src/cli.ts }
      - { from: mdlint.commands, to: mdlint.parser, action: Parses each file, code: src/commands/fix.ts }
      - { from: mdlint.commands, to: mdlint.rules, action: Applies the fixes rules offer, code: src/commands/fix.ts }
