# What ArchDoc's parts send each other, and what its datastores hold. Every
# arrow on a journey carries one of these.
data:
  Command:
    kind: message
    description: An archdoc command line, from a person, an agent, or CI.
    fields:
      command: { type: string, description: "validate, view, check, report, sync, and the rest" }
      args: { type: "string[]" }
      cwd: { type: string }

  Output:
    kind: message
    description: What a command prints, as text or --json, and its exit code.
    fields:
      text: { type: string }
      json: { type: json }
      exit_code: { type: int }

  ToolCall:
    kind: message
    description: An MCP tool call from an agent.
    fields:
      tool: { type: string, description: "archdoc_context, archdoc_show, archdoc_find, archdoc_edit, archdoc_check, archdoc_seal, archdoc_paths, archdoc_triage, archdoc_plan, or archdoc_init" }
      arguments: { type: json }

  ToolResult:
    kind: message
    description: What an MCP tool answers, in the same words the CLI prints.
    fields:
      content: { type: string }
      is_error: { type: bool }

  AgentInstructions:
    kind: message
    description: The workflow a skill, CLAUDE.md, or AGENTS.md teaches an agent.
    fields:
      path: { type: string }
      text: { type: string }

  ModelSources:
    kind: message
    description: The model's files, handed to core to build the model.
    fields:
      root: { type: string }
      sources: { type: "ModelFile[]" }

  CodeIndex:
    kind: message
    description: What the analyzers read from the code for context, search, and eval, per TS/JS, Python, and Go file. Plain data that core ranks.
    fields:
      path: { type: string }
      exports: { type: json, description: "Declarations with their kind and line" }
      imports: { type: json, description: "Named imports, resolved to repository files where possible" }
      literals: { type: "string[]", description: "Strings that look like identifiers, such as tool names" }

  ModelFile:
    kind: entity
    description: One YAML file under .archdoc/.
    fields:
      path: { type: string }
      text: { type: string }

  ExplorerPayload:
    kind: message
    description: What archdoc view serves the explorer at /api/model.
    fields:
      root: { type: string }
      sources: { type: "ModelFile[]" }
      files: { type: "string[]" }
      schemas: { type: json, description: What data entries' schema sources say }
      federation: { type: json, description: Vendored models of other repos }
      commit: { type: string, description: "The commit it was read at, for a branch" }
      snippets: { type: json, description: "Where each code snippet is, so a symbol links to its lines" }
      traces: { type: json, description: The bug traces beside the model }
      seals: { type: json, description: "Facts whose code changed since they were sealed, and the ones never sealed" }
      change: { type: json, description: "With --base: the code changed since the merge base, read into this model (files, elements, uses, proposed elements, entry points), and the findings the PR comment gives" }

  ExplorerAction:
    kind: message
    description: Something a person does in the explorer.
    fields:
      action: { type: enum, values: [open, focus, select, step] }
      target: { type: string }

  SyncRequest:
    kind: message
    description: What archdoc sync asks federation for.
    fields:
      update: { type: bool }
      frozen: { type: bool }

  GitFetch:
    kind: message
    description: A shallow fetch of another repo at a release tag.
    fields:
      url: { type: string }
      ref: { type: string }

  TriageRecord:
    kind: entity
    description: "A Triage record in .archdoc/triage/: a bug as it was reported, the leads followed, and the path the failing request took to its root cause, attached to the journey step it expands, with the fix. Started by archdoc triage start and archdoc_triage, checked by archdoc check, shown by archdoc show and the explorer's Triage tab; never part of the model."
    fields:
      title: { type: string }
      symptom: { type: string, description: "The log line, error, or wrong output" }
      expands: { type: string, description: "<journey>#<step>" }
      steps: { type: json, description: "Hops in journey step syntax, with role, evidence, observed, expected, and missing" }
      fix: { type: json, description: "A sentence, or summary, link, test" }
      triage: { type: string }
      status: { type: enum, values: [open, investigating, root-caused, fixed, wont-fix, cannot-reproduce] }
      severity: { type: enum, values: [low, normal, high, critical] }
      reported: { type: json, description: "by, at, link" }
      hypotheses: { type: json, description: "Leads followed: claim, verdict (open, ruled-out, confirmed), evidence, note" }
      root-cause: { type: json, description: "summary, step" }


  Seal:
    kind: entity
    description: A fingerprint of the code one model fact points at, in archdoc.sum beside the model. When the code changes, someone checks the model and seals the fact again. Written by archdoc seal and archdoc_seal; never part of the model.
    fields:
      fact: { type: string, description: "element:<id>, element:<id>#<path>:<symbol>, step:<journey>#<n>, logic:<id>, mapping:<id>, data:<id>, or contract:<element>#<api>" }
      kind: { type: enum, values: [structure, content, schema] }
      hash: { type: string }
      by: { type: string, description: "Who last checked the model against it" }
      files: { type: json, description: "The files the fingerprint covers, with the exports it read in each" }

  Lock:
    kind: entity
    description: archdoc.lock, the version and integrity each import is pinned at.
    fields:
      imports: { type: json }
      landscape: { type: json }

  Bundle:
    kind: entity
    description: Another repo's model at a release, vendored under .archdoc/vendor/.
    fields:
      namespace: { type: string }
      version: { type: string }
      sources: { type: "ModelFile[]" }

  PullRequest:
    kind: message
    description: A branch pushed with its model edits and a pull request opened against the base.
    fields:
      base: { type: string }
      head: { type: string }
      title: { type: string }
    provenance: { source: suggested, by: agent:claude-code }

  PullRequestEvent:
    kind: event
    description: A pull request opened or updated.
    fields:
      number: { type: int }
      base: { type: string }
      head: { type: string }
  ModelEdit:
    kind: message
    description: "The ops an agent sends archdoc_edit (or archdoc edit) to change the model by ID: add, set, remove, rename, use, and step, run in order and written all or none."
    fields:
      ops: { type: json, description: "The ops, in order, each naming what it changes by ID" }
      by: { type: string, description: "Who suggests what the ops add, such as agent:claude-code" }
      dryRun: { type: bool, description: "Say what would change, and write nothing" }
    provenance: { source: suggested, by: agent:claude-code }
  PlanFile:
    kind: entity
    description: "A plan in .archdoc/plans/: a change designed with the agent before it's built, as changes to the model (archdoc edit ops), sequences of interactions, and notes, each with the person's intent, the agent's suggestions until the person accepts them, what the person changed since the agent last read it, and, once agreed, the tasks that carry it out. Started by archdoc plan start and archdoc_plan, drawn in the explorer's Plan tab, checked by archdoc check; never part of the model."
    fields:
      plan: { type: string }
      title: { type: string }
      status: { type: enum, values: [drafting, reviewing, ready, executing, done, abandoned] }
      goal: { type: string, description: "The idea, as the person put it" }
      by: { type: string }
      scope: { type: json, description: "The elements, journeys, data, and actors the goal touches, as the plan started" }
      changes: { type: json, description: "Each one archdoc edit op (add, set, remove, rename, use) with id, intent, by, status (proposed, suggested, dismissed), and where it sits on the map" }
      sequences: { type: json, description: "New journeys, or new steps for one the model has, each step with its intent" }
      notes: { type: json, description: "Notes, insights, questions, risks, and answers pinned to an item, with replies" }
      tasks: { type: json, description: "title, from (the changes it carries out), files, tests, after, status" }
      unread: { type: json, description: "What the person changed since the agent last read it: id, what" }
      sent: { type: integer, description: How many times the person sent it to the agent }
    provenance: { source: suggested, by: agent:claude-code }
  PlanEdit:
    kind: message
    description: "Edit ops on a plan: put, drop, step, accept, dismiss, reply, resolve, move, set, send, and read. The explorer posts the person's to archdoc view with the text it last read, and the agent sends its own through archdoc plan respond."
    fields:
      ops: { type: json }
      base: { type: string, description: The plan's text as the page last read it; a different one on disk is refused as stale }
      by: { type: string }
    provenance: { source: suggested, by: agent:claude-code }
