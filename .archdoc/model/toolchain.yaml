# What ArchDoc is made of.
elements:
  github:
    kind: external
    description: Hosts the repository, pull requests, and Actions.
    uses:
      github-action:
        description: Runs on every pull request
        sends: PullRequestEvent

  toolchain:
    kind: system
    description: The ArchDoc toolchain.
    owners: [maintainers]
    elements:
      spec:
        kind: container
        deploy: [release.npm]
        technology: TypeScript, Zod, JSON Schema
        description: Source of truth for the model format, the Triage record and plan formats, their JSON Schema, and v1→v2 migration.
        code: [{ path: packages/spec/** }]
        elements:
          schema:
            kind: component
            description: Zod schema for model files, and the JSON Schema generated from it.
            code: [packages/spec/src/schema.ts, packages/spec/src/json-schema.ts]
          migrator:
            kind: component
            description: Converts v1 models (users, components) to v2 (actors, elements).
            code: [packages/spec/src/migrate.ts]
            uses:
              schema: Produces files that match the schema

      core:
        kind: container
        deploy: [release.npm]
        technology: TypeScript
        description: Deterministic engine. Loads, validates, queries, diffs, edits by ID, maps to code, checks rules and data, checks references into other repos, and checks Triage records and plans against the model.
        code: [{ path: packages/core/** }]
        uses:
          spec:
            description: Validates model files against the schema
            sends: ModelFile
          model-files:
            description: Reads the model
            sends: ModelFile
          source-tree: Lists repository files to map them to elements (git ls-files)
        elements:
          loader:
            kind: component
            description: Multi-file loading, reference resolution (deploy targets in environments included), diagnostics with file and line. Leaves out the records beside the model (triage/, plans/, and traces/ from before 0.8), which it reads on their own.
            code: [{ path: packages/core/src/load/** }]
            uses:
              checker: Validates journeys once references resolve
              data:
                description: Checks data references, fields, and lifecycles
              imports:
                description: Loads archdoc.lock and the vendored models of other repos
          query:
            kind: component
            description: Element, actor, and overview queries, where elements are deployed (an environment's nodes, what runs on each, and the uses between them), search by words (and by file paths and symbols with a code index), find (parts of the model by words, place, the file they own, or what they still lack, and an outline of the element tree), impact (consumers, actors, journeys, owners, rules, and consumers and journeys in other repos), context briefs that rank the files and symbols to start a task in, eval scoring (of context briefs against past commits, and of a whole model against a golden one, for its structure and for how well it was discovered), and which experimental parts of the format a model uses.
            code: [{ path: packages/core/src/query/** }]
            uses:
              checker:
                description: Scores how well a model was discovered with the same list archdoc check --done gives
                provenance: { source: suggested, by: agent:claude-code }
              data:
                description: Lists the data the elements of a context brief send and store
              imports:
                description: Adds consumers and journeys in other repos to impact
              loader: Resolves references the same way the model does
              codemap: Turns a file path into its owning element
          codemap:
            kind: component
            description: Maps code to elements. locate (most specific owner wins), files per element, unmapped files, stale paths, and the snippets a code reference points at.
            code:
              - { path: packages/core/src/codemap/** }
              - { path: packages/core/src/codemap/codemap.ts, symbol: locate, description: Which element owns a path }
              - { path: packages/core/src/codemap/snippet.ts, symbol: findSnippet, description: The lines or declaration a code reference points at }
          report:
            kind: component
            description: Text, JSON, and Mermaid answers shared by the CLI, MCP, and the explorer, so people and agents read the same words. summarizeChange is the one verdict on a change that the PR comment, the explorer's Diff tab, and archdoc check all render (formatCheck keeps it short enough for an agent, and says a list of problems is the work list, not a verdict); it also draws the change and its journeys, with their branches. formatPlan writes a plan for the agent, what the person changed first, with what to do next.
            code: [{ path: packages/core/src/report/** }]
            uses:
              imports:
                description: Lists consumers and journeys in other repos, and what a change breaks
              loader:
                description: Names contracts the same way the model checks them
              query: Formats element, actor, overview, and impact results
              checker:
                description: Formats check findings
              differ:
                description: Formats model diffs as text, markdown, and mermaid
              data:
                description: Shows data entries, and the sensitive data a change sends or stores somewhere new
              codemap:
                description: Formats locate results
              traces:
                description: Prints traces, trace checks, and error anchors
              seals:
                description: Prints what archdoc check --seals says
              plans:
                description: Writes a plan for the agent to read
                provenance: { source: suggested, by: agent:claude-code }
          checker:
            kind: component
            description: Validates journeys, and compares the model with the code and its rules (undeclared dependencies, rule violations, stale paths including deployment code, orphans, and components outside containers or code outside components). Lets a container without components hold code elements directly. Also says whether a new model is done (archdoc check --done), listing levels over the limits, small containers with components and big ones without, unmapped code, init's descriptions, test and verification code modeled as elements, unconnected elements, actors (and actors with a kebab-case ID and no plain name:), journeys, steps without an action or code, a missing system and parts outside it, parts not named the way their code is, code elements and steps that point at a whole file instead of a function or lines, components with no code element at the functions that do their work or with more than five, entry points no journey starts at, steps that cross a boundary without saying what they carry, datastores and queues without data, data entries without a description, what no environment places when the repository has deployment files, the warnings the code can answer (setting aside the owners, seals, other repos, and team rules only a person settles), and to keep going however big the repository. Build tooling (devDependencies, tool config files) is not a dependency between elements.
            code: [{ path: packages/core/src/check/** }]
            uses:
              seals:
                description: Reports facts whose code changed since they were sealed
              traces:
                description: Checks the Triage records in .archdoc/triage/ with the model, so check reports stale ones and what each status still needs
              query:
                description: Takes the code index seals fingerprint with
              data:
                description: Runs data rules with the other rules
              codemap:
                description: Maps observed file dependencies onto elements
              loader:
                description: Resolves rule selectors and journey steps
              plans:
                description: Checks open plans with the model
                provenance: { source: suggested, by: agent:claude-code }
          differ:
            kind: component
            description: Semantic diff between two model revisions (actors, elements, relationships, journeys, data, rules), and the code diff the explorer's Diff tab shows. deriveCodeChange reads a branch's changed files (with what the analyzers saw at both ends) into the branch's own model as elements, uses, proposed elements for new code no element maps, and entry points, each marked with whether the model already says it; projectCodeChange draws that change onto the model.
            code: [{ path: packages/core/src/diff/** }]
            uses:
              codemap:
                description: Maps each changed file and dependency to the element that owns it
                provenance: { source: suggested, by: agent:claude-code }
              checker:
                description: Leaves out test code and dev tooling the way check does, and describes the dependencies it maps
                provenance: { source: suggested, by: agent:claude-code }
          imports:
            kind: component
            description: Other repos' models. Packs and reads bundles, checks the lockfile and every reference, contract, and journey step into another repo at its pinned version, and indexes who uses this repo from the others (through the landscape).
            code: [{ path: packages/core/src/federation/** }]
            uses:
              loader: Builds the models inside bundles, and checks contracts the same way
              data:
                description: Checks data in other repos once they're synced
          data:
            kind: component
            description: Data entries and where they go. Resolves data references (here and in other repos), walks data flows and stores (and what a request step gets back), checks fields, lifecycles, and what targets accept, evaluates data rules (stored-in, not-sent-to), flags data names too long for the explorer's chip, and finds sensitive data a change sends somewhere new. Evaluates CEL mappings and logic for field lineage, and for journey simulation, which is experimental and only core runs.
            code:
              - { path: packages/core/src/data/** }
              - { path: packages/core/src/data/flows.ts, symbol: stepMessage, description: The message a journey step carries }
              - { path: packages/core/src/data/simulate.ts, symbol: simulate, description: Runs a journey on a sample (experimental; no surface calls it) }
            uses:
              checker:
                description: Matches rule selectors the same way relationship rules do
              imports:
                description: Reads other repos' data, mappings, and logic for lineage and simulation
          seals:
            kind: component
            description: Seals, in archdoc.sum beside the model. Fingerprints the code each fact points at (an element's files and exports, a snippet's or decision's lines, a step's entry file, a data entry's schema fields, a deployment's infrastructure files), says what changed since someone sealed it, and writes the file again when they have checked.
            code:
              - { path: packages/core/src/seal/** }
              - { path: packages/core/src/seal/seal.ts, symbol: fingerprints, description: What each fact's code is now }
            uses:
              codemap:
                description: Finds the files each element owns, and the snippets facts point at
              loader:
                description: Reads decisions' and mappings' code references
              query:
                description: Reads the exports in the code index
              data:
                description: Reads what schema sources say
              checker:
                description: Reports in the shape of check's findings
          traces:
            kind: component
            description: "Triage records, in .archdoc/triage/, never part of the model. Parses them, works out each record's status, checks them against the model and the code (elements, the journey step they expand, code references, hops the model doesn't declare, what the status needs: a cause and root cause once root-caused, a fix once fixed, and that every step says what happened there and what it carried), and places a bug report on elements and ranked journey steps by its stack frames, paths, and the names in it, elements a report in plain words names included, with a record to start from that asks each step for its description and data."
            code:
              - { path: packages/core/src/trace/** }
              - { path: packages/core/src/trace/check.ts, symbol: checkTrace, description: Checks a trace and resolves it for drawing }
              - { path: packages/core/src/trace/anchor.ts, symbol: anchorError, description: Where an error belongs }
            uses:
              loader:
                description: Parses trace YAML and resolves references the way journey steps do
              codemap:
                description: Maps code references and stack frames to elements, and checks lines and symbols
              query:
                description: Finds the journey steps through the elements an error names
              imports:
                description: Resolves hops and journeys in other repos
              data:
                description: Resolves the data entries a record's steps send, to say which names aren't data
                provenance: { source: suggested, by: agent:claude-code }
          editor:
            kind: component
            description: "Changes model files by ID (add, set, remove, rename, use, step) and rewrites the references a rename or move breaks; a container, datastore, or queue added with no parent goes inside the model's one system. Pure: takes the files' text and returns the changed text, rewriting only the lines each change touches, so comments and everything else keep their text."
            code: packages/core/src/edit/**
            uses:
              loader:
                description: Resolves IDs and references the way the model does
          plans:
            kind: component
            description: "Plans, in .archdoc/plans/, never part of the model. Parses them, and says what each touches (its intents, on a box or between two, its changes, and its sequences) for a map that shows only that; makes a plan's agreed changes and sequences on a copy of the model's sources one at a time, so one that can't be made doesn't stop the rest; and checks it: every change and step has its intent, what can't be made and why, what the plan would break (findings the model with the plan has that the model hasn't), open questions and suggestions, the journeys, actors, owners, and other repos it reaches, the tasks once it's ready, and while it's carried out, which changes the model doesn't show yet. Edits a plan file by op, all or none, and records what the person changed for the agent's next read."
            code:
              - path: packages/core/src/plan/**
              - path: packages/core/src/plan/check.ts
                symbol: checkPlan
                description: Checks a plan against the model
              - path: packages/core/src/plan/check.ts
                symbol: applyPlan
                description: Makes a plan on a copy of the model
              - path: packages/core/src/plan/edit.ts
                symbol: editPlan
                description: Edits a plan file by op
            provenance: { source: suggested, by: agent:claude-code }
            uses:
              editor:
                description: Makes each change on a copy of the model's sources
                provenance: { source: suggested, by: agent:claude-code }
              checker:
                description: Checks the model with the plan made
                provenance: { source: suggested, by: agent:claude-code }
              query:
                description: Finds what each change reaches
                provenance: { source: suggested, by: agent:claude-code }
              loader:
                description: Builds the model with the plan made
                provenance: { source: suggested, by: agent:claude-code }

      analyzers:
        kind: container
        deploy: [release.npm]
        technology: TypeScript (ts.preProcessFile), yaml
        description: "Pluggable analyzers that find the dependencies code actually has (workspace manifests, and TS/JS, Python, and Go imports, resolved through workspaces, Python project roots, and Go modules), a symbol index (exported declarations and named imports per TS/JS, Python, and Go file) for search and context, and schema importers that read data entries' fields from SQL migrations, Prisma, OpenAPI and JSON Schema, and Protobuf. loadRevision builds the model at any ref the way every surface reads it, and check --base checks the merge base the same way. codeChange reads what a branch's code changed since it left another branch (analyzers and entry points at both ends of the merge base) into the branch's model, for the explorer's Diff. Reads archdoc.sum and the files seals fingerprint, and finds the facts a change sealed again. Answers the agent's questions for the CLI and MCP alike (context, show, find, check, seal, paths, triage, which starts, lists, checks, and migrates Triage records, and plan, which starts a plan with its scope, waits for the person to send it, reads it with what they changed first, takes the agent's answer as suggestions it can't use to change the person's items, and tracks its tasks), applies edits by ID and refuses one that adds errors to the model, and init infers a starting model from manifests, compose files, imports, schema files, and the AWS CDK and Terraform (tables, queues, functions, grants, triggers, and environments), layer by layer (containers and their components, leaving code elements to whoever reads the code) inside a system, with uses from imports at the level where the two sides part. Init keeps a container with fewer than five source files lean, with no components, and never makes a component of one file: files beside the directories, and a flat package's files, stay with their container. context says to start a Triage record first when the task reads like a bug. paths finds where flows start (routes, consumers, schedules, commands, pages) and the calls each makes, in TypeScript, Python, and Go; with many, it summarizes them by place and resource, lists one group on request, and can fold a call tree to the hops between elements."
        code: [{ path: packages/analyzers/** }]
        uses:
          source-tree: Reads manifests, imports, and infra files
          core:
            description: Produces core's ObservedDependency records
          model-files:
            description: Writes archdoc.sum for seal, and a starting model for init
            sends: [Seal, ModelFile]
          editor:
            description: Edits the model by ID for archdoc edit and archdoc_edit

      federation:
        kind: container
        deploy: [release.npm]
        technology: Node.js, git, semver
        description: Shares models across repos. `sync` reads other repos' models (and the landscape, with every model it pins) at their release tags and vendors them, pinned in archdoc.lock; `publish` writes a versioned bundle, with what the model's schema sources say. Experimental (docs/experimental.md).
        code: [{ path: packages/federation/** }]
        uses:
          core: Builds and validates bundles, and reads the current lock
          analyzers:
            description: Reads the schema sources a bundle carries the fields of
          spec: Reads and writes the lockfile and bundle formats
          model-files:
            description: Writes archdoc.lock and the bundles in .archdoc/vendor/
            sends: [Lock, Bundle]
          other-repos:
            description: Lists release tags and reads the model at a tag
            sends: GitFetch

      cli:
        kind: container
        deploy: [release.npm, workstation.node, ci.actions]
        technology: Node.js, commander
        description: "`archdoc` command. For agents, the same answers as the MCP tools: init, context, show, find, edit, check, seal, paths, triage, and plan. For people and CI: validate, view, site, map, diff, report, mcp, and schema. sync, publish, landscape build, and view --landscape are experimental and left out of --help. eval and migrate are hidden maintainer commands."
        code: [{ path: packages/cli/** }]
        uses:
          core:
            description: Commands delegate to core
            sends: ModelSources
          spec: Migrates v1 files and prints the JSON Schema
          web:
            description: Serves the explorer, the raw model files (and with --base, the files at a ref), and change events for `archdoc view`
            sends: ExplorerPayload
          mcp: Starts the MCP server for `archdoc mcp`
          analyzers:
            description: Runs analyzers for `archdoc check`, and builds the code index for `context`, `search`, `eval`, and seals
          federation:
            description: Runs `archdoc sync` and `archdoc publish`
            sends: SyncRequest
        elements:
          commands:
            kind: component
            description: One module per command. view --detach starts the explorer in a process of its own, waits until it listens, prints its URL, and returns, reusing one already running on the same model.
            code: [{ path: packages/cli/src/commands/** }]
            uses:
              view-server:
                description: Starts the server for `archdoc view`
          view-server:
            kind: component
            technology: node:http, fs.watch, server-sent events
            description: "Localhost-only server for the explorer. Sends model files, not a built model, so the browser runs core itself; with them, other repos' vendored models, which sealed facts to re-check, Triage records, and plans. Takes the person's plan edits from the Plan tab: JSON only, from the explorer's own origin, against the text the page last read, so the person and the agent never write over each other."
            code: [packages/cli/src/server.ts]
            uses:
              analyzers:
                description: Applies the person's plan edits
                provenance: { source: suggested, by: agent:claude-code }

      mcp:
        kind: container
        deploy: [release.npm, workstation.agent]
        technology: Node.js, @modelcontextprotocol/sdk (stdio)
        description: "MCP tools for agents, one per question: archdoc_context (where to start, from a task, paths, or an error, with known bugs on what it touches), archdoc_show (one thing by ID), archdoc_find (parts of the model by words, place, file, or what they lack, or its outline), archdoc_edit (change the model by ID), archdoc_check (what's wrong or stale, and with a base, what the change does), archdoc_seal (record checked facts), archdoc_paths (where flows start and the calls each makes), archdoc_triage (start a Triage record from a bug, check one, list them, or wait for one sent from the explorer), archdoc_plan (design a change with the person: start a plan, wait for what they want on the map, read it, respond with the architecture that carries out each intent as suggestions, and carry out its tasks), and archdoc_init (start a model). Only edit, seal, triage, plan, and init write."
        code: [{ path: packages/mcp/** }]
        uses:
          core:
            description: Tool calls delegate to core
            sends: ModelSources
          analyzers:
            description: Every tool is an answer analyzers gives, the same one the CLI prints

      web:
        kind: container
        deploy: [workstation.browser]
        technology: React 19, Vite, @xyflow/react, elkjs
        description: "Explorer. Two top-level tabs, Explore and Build, each with tabs beneath it. Explore has Overview (journeys as cards, owners, a top-level map), Journeys (on the map by default, or as a sequence with lanes per participant, branches by outcome, one step at a time), Data (entries, tables, lineage), and Infrastructure (one environment at a time, its nodes as boxes inside boxes colored by what they are, what runs on each, and the uses between them). Build has Plan (the person designs a change on the map with the agent: they click in a box and say what they want there, in a popover where they clicked, pinned in the box; the agent works out the architecture as suggestions, dashed, to accept or dismiss, each saying which intent it's for; the model as it would be with the plan made, drawn with the explorer's diff marks; notes and replies; what the plan reaches and what its check found; Send to agent and Mark ready; read-only on a published site), Triage (Triage records by status; each one's report, leads, root cause, and fix, and the bug's journey on the map one step at a time with the cause in red, or as lanes beneath the modeled step, checked in the browser; a start panel that places a pasted error, and Send to agent, which writes the record and hands it over with what the person wants, from the start panel or a record's header), and Diff (a header with the branches and the PR comment's verdict, and what changed on the map). Each Build tab has the same shape: a list beside a header (what it is, where it stands, its controls, Send to agent) over the map. The map starts at the C4 context and opens a level at a time (containers, then components), left to right or top down; a box's kind is its shape and its color, with a key, and every use says what it's for on its line. Runs from any path, so a landscape's site is the same explorer, grouped by repo, team, or domain."
        code: [{ path: apps/web/** }]
        uses:
          core:
            description: Builds and queries the model in the browser (@archdoc/core/browser)
            sends: ModelSources
        elements:
          model-loader:
            kind: component
            description: "Fetches the model files and rebuilds the model on every change event; reads it for the tabs (which tabs sit under Explore and Build, journey cards and lanes, journeys in sections by topic, the Diff of a branch's code change read into its model with branch 1 defaulting to the working tree and branch 2 to main, the address, with old #traces= links opening the Triage tab), with the facts whose sealed code changed; reads plans, checks each in the browser, and makes it on a copy of the model for the map, with what's suggested and what has notes; reads a plan as a conversation (whose turn it is, each intent with the agent's answer, the question still open) and places and names a box the person draws; writes the person's plan edits to archdoc view against the text it last read; reads Triage records and checks them in the browser, groups them by status, turns one into a journey for the map, and says what each of its steps carried, as the record says or else as the model says the use carries; names actors in plain words when they have no name:."
            code: [{ path: apps/web/src/model/** }]
            uses:
              graph: Hands the model to the canvas
              view-server:
                description: Writes the person's plan edits, against the text it last read
                sends: PlanEdit
                provenance: { source: suggested, by: agent:claude-code }
          graph:
            kind: component
            description: Decides what's visible (never code elements, which stand for their component; the C4 context and containers, with one box for a model without a system; expand, focus, a plan's focus on what it touches and the arrows between those, journeys, a landscape's boxes by repo, team, or domain, and an environment's infrastructure), lifts relationships to visible boxes, sizes each use's description, and lays them out with ELK, keeping room for the descriptions; routes a journey step no use joins straight across between its boxes; times a step's message chip to move at one speed whatever the line's length, there and back for a request and its response; and gathers the Data tab's catalog (each store's tables and who reaches it, each entry's stores, producers, and journey steps).
            code: [{ path: apps/web/src/graph/** }]
          ui:
            kind: component
            description: "Tabs (Explore and Build, and the tabs beneath each, with Build's Plan tab), the map (cards colored by kind, one box for its key, layout, and descriptions, the level control, and the minimap, a step's message moving along its arrow and a response coming back, and a bug's steps colored by what they did), journey lanes and the step panel, the Plan tab's list, header (whose turn it is, Add or Explore for what a click does, Mark ready, and Send to agent for edits not sent yet), and panel (the plan as a conversation: each thing the person said with the agent's answer under it, suggestions to accept or dismiss and questions to tap, settled turns folded to a line, and a box at the bottom that answers the open question or says something new and sends it at once; what it reaches, the check, and tasks behind a fold), the map in plan mode (in Add, a click opens a small menu where it lands, with the box's description, to add a box there with what it's for or a note, pinned in the box; a drag or an arrow for how two boxes connect; in Explore a click reads the box; intents as numbered pins, suggested boxes and arrows dashed, a dot on boxes with notes), the Send to agent button every Build tab shares (with what to ask, for a bug), the Triage tab's list, record (a small header with the root cause in brief and Send to agent, so the map keeps the room) and step panel (what happened, the data it carried, observed and expected), and start panel, the Diff tab's header, the Data tab's pages, the side lists (journeys with their whole titles, under the section each declares, or by the part of the system they run in when there are many), and the details panel with code links, where a component lists its code elements under Key code."
            code: [{ path: apps/web/src/components/**, description: Components }, apps/web/src/App.tsx, { path: apps/web/src/styles.css, description: Styles and tokens }]
            uses:
              graph: Renders the laid-out graph
              model-loader:
                description: Gets the model, files, and repository links

      github-action:
        kind: container
        deploy: [release.github, ci.actions]
        technology: GitHub Actions (composite), actions/github-script
        description: Posts a pull request comment that leads with a verdict (what blocks the merge, what to check, who to involve) only when there is something to fix or check, otherwise writes the report to the job summary; puts introduced findings on their lines, and fails on drift the pull request introduces.
        code: [{ path: integrations/github-action/** }]
        uses:
          cli:
            description: Runs archdoc report and archdoc check against the pull request's base
            sends: Command

      agent-skills:
        kind: container
        deploy: [release.github, workstation.agent]
        technology: Claude Code plugin and marketplace, Markdown (skill, AGENTS.md), MCP configs
        description: "Teaches coding agents the workflows. A change starts with a context brief and ends with check and seal, with the model edited alongside the code. A bug starts with archdoc_triage, which places the error and starts a Triage record, and ends with the record's root cause (and fix), with evidence on every step and every lead ruled in or out. A change to design starts with archdoc_plan: the person sketches it on the explorer's map with the intent of each part, the agent reviews it against the code and answers with notes and suggestions until it's solid, then writes the tasks and carries them out. A repository without a model starts with init. Asked to show the model, the skill starts `archdoc view` in the background and gives the user its URL (a static `archdoc site` on a remote machine), and `/archdoc:view` does the same. Claude Code users install it as a plugin (the skills, and an MCP server pinned to the CLI released with it) from the marketplace at the repository root; other agents get an AGENTS.md snippet, MCP configs, and the skill to copy to `.agents/skills/`, where Codex looks for it."
        code: [{ path: integrations/agent-skills/** }, { path: integrations/claude-plugin/** }, .claude-plugin/**, .claude/**, .agents/**, AGENTS.md, CLAUDE.md, .mcp.json]
        uses:
          mcp: Points agents at the MCP tools
          cli:
            description: Has the agent start `archdoc view` in the background, or write `archdoc site`, to show the user the model
            sends: Command
            provenance: { source: suggested, by: agent:claude-code }

      landscape-template:
        kind: container
        deploy: [release.github]
        technology: Markdown, YAML, GitHub Actions
        description: Starting point for a landscape repo. A model with teams, a cross-team journey, domains, and an org rule, and a workflow that takes every team's newest release weekly and publishes the site to GitHub Pages. Experimental, with federation (docs/experimental.md).
        code: [{ path: integrations/landscape-template/** }]
        uses:
          cli: Runs archdoc sync --update and archdoc landscape build

      model-files:
        kind: datastore
        technology: YAML in git (.archdoc/)
        description: The human-owned architecture model, versioned with the code.
        code: [{ path: .archdoc/** }]
        stores:
          ".archdoc": { entity: ModelFile, key: path }
          archdoc.lock: { entity: Lock }
          vendor: { entity: Bundle, key: namespace }
          triage: { entity: TriageRecord, key: triage }
          archdoc.sum: { entity: Seal, key: fact }
          plans:
            entity: PlanFile
            key: plan

      other-repos:
        kind: external
        description: Other teams' repositories whose models this one imports, read at their release tags.

      source-tree:
        kind: datastore
        technology: Git working tree
        description: The code the model maps to.
