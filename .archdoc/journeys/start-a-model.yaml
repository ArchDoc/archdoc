journey: start-a-model
actor: coding-agent
goal: Start a model for a repository that has none, and get a person to accept it
importance: high
steps:
  - from: coding-agent
    to: agent-skills
    action: Reads the "model this repository" workflow
    code: integrations/claude-plugin/skills/archdoc/SKILL.md
  - from: coding-agent
    to: mcp
    action: Calls archdoc_init in a repository with no .archdoc/
    code: packages/mcp/src/server.ts
    sends: ToolCall
  - from: mcp
    to: analyzers
    action: Infers elements from manifests and compose files, uses from imports, and data from schema files
    code: packages/analyzers/src/init.ts
    sends: CodeIndex
  - from: analyzers
    to: model-files
    action: Writes .archdoc/ with every fact marked inferred
    sends: ModelFile
  - from: mcp
    to: coding-agent
    action: Returns what it found and what to add next, which the agent does with the code open, calling archdoc_check until it's clean
    sends: ToolResult
  - from: coding-agent
    to: mcp
    action: Finds what's left with archdoc_find, and reshapes, connects, and describes the model by ID with archdoc_edit, a step of work per call
    code: packages/mcp/src/server.ts
    sends: ToolCall
  - from: mcp
    to: analyzers
    action: Applies the ops and checks the model they make, refusing an edit that adds errors
    code: packages/analyzers/src/model-edit.ts#editAnswer
    sends: ModelEdit
  - from: analyzers
    to: toolchain.core.editor
    action: Changes only the lines each op touches, and rewrites the references a rename breaks
    code: packages/core/src/edit/edit.ts#editModel
    sends:
      - ModelSources
      - ModelEdit
  - from: analyzers
    to: model-files
    action: Writes the changed files, and answers with what the edit fixed and the new warnings
    sends: ModelFile
  - from: developer
    to: web
    action: Reviews the inferred and suggested facts in archdoc view, accepts them, and runs archdoc seal --all
    code: apps/web/src/App.tsx
section: Map the system
