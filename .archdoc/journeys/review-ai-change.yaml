journey: review-ai-change
actor: developer
goal: Understand what an AI-authored PR changes in the architecture before merging
importance: critical
steps:
  - from: coding-agent
    to: mcp
    action: Edits the model with the code, marking what it adds as suggested, and checks the change
  - from: coding-agent
    to: github
    action: Pushes the change with its model edits and opens the pull request
  - from: github
    to: github-action
    action: Runs on the pull request
  - from: github-action
    to: cli
    action: Runs archdoc report and archdoc check against the pull request's base
    code: integrations/github-action/action.yml
  - from: cli
    to: core
    action: Diffs base vs. head, maps changed files to elements, and checks drift, rules, and journeys
    code: packages/core/src/report/pr-report.ts
  - from: developer
    to: web
    action: Opens the Diff (archdoc view --base), which reads the pull request's code change into its model, and reviews what's not in the model yet and the suggested facts
