# Copy to .github/workflows/archdoc-landscape.yml in the landscape repo.
#
# - Weekly (or on demand): take every team's newest release (archdoc sync --update)
#   and open a pull request, so model changes from other repos get reviewed.
# - On every push to main: check the composed landscape and publish the
#   explorer to GitHub Pages (Settings → Pages → Source: GitHub Actions).
name: ArchDoc landscape
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  update:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write # the sync branch
      pull-requests: write # the sync pull request
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      # Private repos: a token that can read every team's repo.
      - name: Let git read the other repos
        env:
          TOKEN: ${{ secrets.ARCHDOC_READ_TOKEN }}
        if: env.TOKEN != ''
        run: git config --global url."https://x-access-token:${TOKEN}@github.com/".insteadOf "https://github.com/"
      - run: npx -y @archdoc/cli@0.9.3 sync --update
      - uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7.0.11
        with:
          branch: archdoc/sync
          title: "chore: take the newest releases of every team's model"
          commit-message: "chore: archdoc sync --update"
          body: Runs `archdoc sync --update`. Review the model changes, then merge to republish the landscape.

  site:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write # deploy-pages proves the run to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: npx -y @archdoc/cli@0.9.3 sync --frozen
      - run: npx -y @archdoc/cli@0.9.3 landscape build --out site
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
